# WHERE + HOW External Secrets fetches secrets: AWS Secrets Manager in eu-north-1,
# authenticating as the IRSA ServiceAccount eksctl created (external-secrets/external-secrets).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-north-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets

{{- if .Values.externalSecret.enabled }}
# ESO reads the JSON secret from AWS Secrets Manager (via IRSA) and creates the
# Kubernetes Secret "backend-secrets" from it. Git never contains the values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-secrets
  labels: {{- include "crud.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: backend-secrets
  dataFrom:
    - extract:
        key: {{ .Values.externalSecret.secretsManagerKey }}
{{- end }}

# WEEK 11 alert rules (plain YAML, not a Helm template: {{ }} here is for Prometheus).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: crud-alerts
  namespace: crud
spec:
  groups:
    - name: crud.rules
      rules:
        - alert: CrudHighErrorRate
          expr: |
            100 * sum(rate(http_request_duration_seconds_count{namespace="crud", job="backend", status_code=~"5.."}[5m]))
              / sum(rate(http_request_duration_seconds_count{namespace="crud", job="backend"}[5m])) > 5
          for: 2m
          labels: { severity: critical, team: crud }
          annotations:
            summary: "Backend error rate above 5%"
            description: '{{ $value | printf "%.1f" }}% of backend requests are failing (5xx).'

        - alert: CrudPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="crud"}[10m]) > 2
          for: 1m
          labels: { severity: warning, team: crud }
          annotations:
            summary: "Pod {{ $labels.pod }} is restarting repeatedly"
            description: '{{ $labels.pod }} restarted {{ $value | printf "%.0f" }} times in 10 minutes.'

        - alert: CrudHighP95Latency
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace="crud", job="backend"}[5m]))) > 1
          for: 5m
          labels: { severity: warning, team: crud }
          annotations:
            summary: "Backend p95 latency above 1 s"
            description: 'p95 is {{ $value | printf "%.2f" }} s.'
            runbook_url: "https://github.com/EbotProg/Learning-Devops-Week-11-Observability-and-Security/blob/main/docs/RUNBOOK-p95-latency.md"

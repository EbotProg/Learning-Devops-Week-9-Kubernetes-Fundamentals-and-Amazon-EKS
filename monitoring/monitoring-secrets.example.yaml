# COPY to monitoring-secrets.yaml (git-ignored) and paste your Discord webhook URL.
alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"                  # default: discard (the ~100 built-in rules would spam Discord)
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: discord
          matchers:
            - team = "crud"             # only OUR alert rules go to Discord
    receivers:
      - name: "null"
      - name: discord
        discord_configs:
          - webhook_url: "https://discord.com/api/webhooks/PASTE/YOURS"
            send_resolved: true
